[project]
name = "perihelion"
version = "0.1.0"
description = "PERIHELION: a non-Euclidean Teleglitch-like survival shooter."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2.5",
    "python-dotenv>=1.2.2",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest",
    "maturin",
    "mypy>=1.14",
    "pillow>=12.3.0",
    "hypothesis>=6.156.6",
    "scipy>=1.17.1",
    "soundfile>=0.14.0",
    "pedalboard==0.9.22",
    "librosa>=0.11.0",
    "pyloudnorm>=0.2.0",
    "praat-parselmouth>=0.4.7",
    "pyworld>=0.3.5",
    "setuptools<81",
    "torchcrepe>=0.0.24",
    "pyrubberband>=0.4.0",
    "essentia>=2.1b6.dev1438",
    "pysfizz>=0.1.3",
    "mido>=1.3.3",
    "scikit-learn>=1.9.0",
    "matplotlib>=3.11.0",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
]

[tool.setuptools]
package-dir = {"" = "game"}

[tool.setuptools.packages.find]
where = ["game"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["game/tests"]
# PARALLEL BY DEFAULT. The suite is ~44s of work on one core and the
# machine has many; running it serially was the reason it only ever got
# run in the background, where an interrupted run strands it. 12 workers
# is measured, not guessed: 8/12/16/24 all land within a second of each
# other and 32 is worse (worker startup outweighs the gain).
# `-p no:cacheprovider` is deliberately NOT set — the cache is what lets
# `--lf` re-run just the failures.
# `not slow` deselects the handful of end-to-end scenarios whose
# INVARIANT is already covered by a fast constructed test beside them —
# they walk a bot across the real level to re-prove it. The gate runs
# the complete set:
#
#     uv run pytest -q -m ""        # everything, including slow
# 18 workers is measured, not guessed: 14/18 land ~9.1-9.5s, 22 slips to
# 10.1s and 26 to 12.2s as worker startup outweighs the packing gain.
addopts = "-n 18 -m 'not slow'"
markers = [
    "slow: a slower test; deselect with '-m \"not slow\"' for a fast subset",
]

# MYPY: what a type checker can and cannot prove about coordinate spaces.
#
# It proves the TYPE distinctions — place vs difference vs raw tuple — from
# game/stubs/necore.pyi, statically: `place + place` has no overload and is
# rejected before anything runs. It cannot prove space IDENTITY, because a
# space id is a runtime value; that half raises FrameMismatch. Claiming
# more than this would be dishonest (FRAME_SYSTEM_DESIGN_20260729.md §11).
#
# `check_untyped_defs` is the load-bearing setting: almost nothing in
# game/perihelion carries annotations, and without it mypy would skip
# every function body — including all the coordinate arithmetic this is
# here to check.
[tool.mypy]
files = ["game/perihelion"]
mypy_path = "game/stubs"
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
