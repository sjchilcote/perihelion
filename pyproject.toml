[project]
name = "perihelion"
version = "0.1.0"
description = "PERIHELION: a non-Euclidean Teleglitch-like survival shooter."
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.5",
    "numpy>=1.26,<2.5",
]

[dependency-groups]
dev = [
    "pytest",
    "maturin",
    "pillow>=12.3.0",
    "hypothesis>=6.156.6",
    "scipy>=1.17.1",
    "soundfile>=0.14.0",
    "pedalboard==0.9.22",
    "librosa>=0.11.0",
    "pyloudnorm>=0.2.0",
    "praat-parselmouth>=0.4.7",
    "pyworld>=0.3.5",
    "setuptools<81",
    "torchcrepe>=0.0.24",
    "pyrubberband>=0.4.0",
    "essentia>=2.1b6.dev1438",
    "pysfizz>=0.1.3",
    "mido>=1.3.3",
]

[tool.setuptools]
package-dir = {"" = "game"}

[tool.setuptools.packages.find]
where = ["game"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["game/tests"]
markers = [
    "slow: a slower test; deselect with '-m \"not slow\"' for a fast subset",
]
