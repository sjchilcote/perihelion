[mutmut]
paths_to_mutate =
    perihelion/coordination.py
    perihelion/signals.py
    perihelion/topology.py
pytest_add_cli_args =
    --override-ini
    pythonpath=.
    -n
    0
    -m
    not slow
pytest_add_cli_args_test_selection =
    tests/test_coordination.py
    tests/test_coordination_boundaries.py
    tests/test_hub_topology.py
    tests/test_signal_boundaries.py
    tests/test_signals.py
    tests/test_topology_contracts.py
also_copy =
    perihelion
    tests
    stubs
mutate_only_covered_lines = false
debug = true
